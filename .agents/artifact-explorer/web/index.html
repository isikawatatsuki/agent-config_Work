<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Artifact Library</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/vendor/lucide.js"></script>
  <script defer src="/app.js"></script>
</head>
<body class="explorer-page">
  <header class="app-header">
    <button class="icon-button mobile-menu" id="menu-toggle" title="フォルダーを表示" aria-label="フォルダーを表示"><i data-lucide="panel-left"></i></button>
    <a class="brand" href="/"><span class="brand-mark"><i data-lucide="library"></i></span><span>Artifact Library</span></a>
    <div class="search-box"><i data-lucide="search"></i><input id="search" type="search" placeholder="タイトル、タグ、本文を検索" aria-label="資料を検索" autocomplete="off"><span class="search-mark">全文</span></div>
    <span class="local-badge"><span></span>LOCAL</span>
  </header>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="資料の分類">
      <div class="workspace-label">WORKSPACE<span>Shiftplus</span></div>
      <nav class="main-nav" aria-label="表示切替">
        <button data-nav="all" class="nav-item active"><i data-lucide="files"></i><span>すべての資料</span><b id="total-count">0</b></button>
        <button data-nav="index" class="nav-item"><i data-lucide="list-ordered"></i><span>タイトル索引</span></button>
        <button id="open-trash" class="nav-item"><i data-lucide="trash-2"></i><span>ごみ箱</span></button>
      </nav>
      <div class="section-label">フォルダー<button id="new-folder-side" class="icon-button" title="フォルダーを作成" aria-label="フォルダーを作成"><i data-lucide="folder-plus"></i></button></div>
      <nav id="folder-tree" class="folder-tree" aria-label="フォルダー一覧"></nav>
      <div class="section-label">タグ<button id="clear-tag" class="icon-button" title="タグの絞り込みを解除" aria-label="タグの絞り込みを解除"><i data-lucide="filter-x"></i></button></div>
      <div id="tag-list" class="tag-list"></div>
      <div class="storage-label"><i data-lucide="hard-drive"></i><div>ローカルライブラリ<small>.agents/artifacts/</small></div></div>
    </aside>
    <main class="library-pane">
      <div class="library-heading"><div><div class="eyebrow" id="eyebrow">LIBRARY</div><h1 id="view-title">すべての資料</h1></div><button id="scan" class="button secondary" title="索引を更新" aria-label="索引を更新"><i data-lucide="refresh-cw"></i><span>索引を更新</span></button></div>
      <nav id="breadcrumbs" class="breadcrumbs" aria-label="現在の場所"></nav>
      <div class="toolbar">
        <div class="segmented" role="group" aria-label="ファイルの種類"><button data-kind="" class="active">すべて</button><button data-kind="html">HTML</button><button data-kind="pdf">PDF</button></div>
        <div class="toolbar-actions"><button id="new-folder" class="icon-button" title="新規フォルダー" aria-label="新規フォルダー"><i data-lucide="folder-plus"></i></button><select id="sort" aria-label="並び順"><option value="modified">更新順</option><option value="title">タイトル順</option><option value="path">パス順</option></select><div class="view-toggle" role="group" aria-label="表示形式"><button data-layout="list" class="icon-button active" title="リスト表示" aria-label="リスト表示"><i data-lucide="list"></i></button><button data-layout="grid" class="icon-button" title="タイル表示" aria-label="タイル表示"><i data-lucide="layout-grid"></i></button></div></div>
      </div>
      <div class="file-commands" role="group" aria-label="選択したファイルの操作">
        <button id="open-document" class="button secondary" disabled><i data-lucide="external-link"></i>開く</button>
        <button id="edit-metadata" class="icon-button" title="タイトル・概要・タグを編集" aria-label="タイトル・概要・タグを編集" disabled><i data-lucide="sliders-horizontal"></i></button>
        <button id="move-document" class="icon-button" title="移動・名前変更" aria-label="移動・名前変更" disabled><i data-lucide="folder-input"></i></button>
        <button id="delete-document" class="icon-button danger" title="選択したファイルを削除" aria-label="選択したファイルを削除" disabled><i data-lucide="trash-2"></i></button>
        <button id="delete-folder" class="icon-button danger" title="現在のフォルダーを削除" aria-label="現在のフォルダーを削除" hidden><i data-lucide="folder-minus"></i></button>
        <span id="selection-status">選択なし</span>
      </div>
      <div class="results-line"><span id="result-count" aria-live="polite">読み込み中</span><button id="reset-filters" class="text-button" hidden>絞り込みを解除</button></div>
      <div id="error-banner" class="error-banner" role="alert" hidden></div>
      <div id="document-list" class="document-list" aria-label="資料一覧" aria-busy="true"></div>
      <footer class="list-footer"><span id="index-status">索引を読み込み中</span><span>HTML / PDF</span></footer>
    </main>
  </div>
  <dialog id="editor-dialog" aria-labelledby="dialog-title">
    <form id="editor-form"><div class="dialog-heading"><h2 id="dialog-title"></h2><button type="button" id="dialog-close" class="icon-button" title="閉じる" aria-label="閉じる"><i data-lucide="x"></i></button></div><div id="dialog-fields"></div><p id="dialog-error" class="form-error" role="alert"></p><div class="dialog-footer"><button type="button" id="dialog-cancel" class="button secondary">キャンセル</button><button type="submit" id="dialog-save" class="button primary"><i data-lucide="check"></i><span>保存</span></button></div></form>
  </dialog>
  <dialog id="trash-dialog" aria-labelledby="trash-title">
    <div class="dialog-heading"><h2 id="trash-title">ごみ箱</h2><button type="button" id="trash-close" class="icon-button" title="閉じる" aria-label="ごみ箱を閉じる" autofocus><i data-lucide="x"></i></button></div>
    <p id="trash-error" class="form-error" role="alert"></p>
    <div id="trash-list" aria-label="削除した項目" aria-live="polite"></div>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
